<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Stats</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#141216; --panel:#1f1b22; --text:#efe6d8; --muted:#9a8f88; --line:#352e33; --grid:#2a252c; --accent:#e0a84a;
  }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, sans-serif; padding:16px; }
  main { display:inline-block; min-width:min(100%, 760px); }
  header { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:12px; }
  h1 { font-size:20px; margin:0; }
  h2 { font-size:15px; margin:0; color:var(--muted); font-weight:600; }
  .meta { color:var(--muted); font-size:14px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#666; margin-right:6px; vertical-align:middle; }
  .dot.live { background:#5ec26a; }
  table { border-collapse:collapse; background:var(--panel); border-radius:8px; overflow:hidden; table-layout:fixed; }
  th, td { padding:10px 14px; text-align:right; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.04em; }
  th:first-child, td:first-child { text-align:left; width:180px; }
  tr:last-child td { border-bottom:none; }
  td.name { font-weight:600; }
  td.name small { display:block; color:var(--muted); font-weight:400; font-size:12px; }
  td.top { color:var(--accent); }
  .swatch { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:8px; vertical-align:baseline; }
  .empty { color:var(--muted); padding:24px; text-align:center; }
  .charts-head { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin:20px 0 10px; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  .legend span { display:inline-flex; align-items:center; }
  .charts { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:12px; }
  .chart { background:var(--panel); border-radius:8px; padding:12px 12px 8px; position:relative; }
  .chart svg { display:block; width:100%; height:160px; overflow:visible; }
  .chart .gridline { stroke:var(--grid); stroke-width:1; }
  .chart .axis { fill:var(--muted); font-size:11px; }
  .chart .series { fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .chart .marker { stroke:var(--panel); stroke-width:2; }
  .chart .crosshair { stroke:var(--muted); stroke-width:1; stroke-dasharray:3 3; }
  .tip { position:absolute; pointer-events:none; background:#2b262e; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:12px; color:var(--text); white-space:nowrap; box-shadow:0 4px 14px rgba(0,0,0,.4); display:none; z-index:2; }
  .tip b { display:block; margin-bottom:4px; }
  .tip div { display:flex; justify-content:space-between; gap:14px; font-variant-numeric:tabular-nums; }
  .tip div span:first-child { color:var(--muted); }
  @media (max-width:640px){ th, td { padding:8px 6px; font-size:14px; width:72px; } th:first-child, td:first-child { width:120px; } }
</style>
</head>
<body>
<main>
<header>
  <h1>Run Stats</h1>
  <span class="meta"><span id="dot" class="dot"></span><span id="status">connecting…</span></span>
  <span class="meta" id="run"></span>
</header>
<table>
  <thead><tr>
    <th>Player</th><th>Damage</th><th>Block</th><th>Prevented</th><th>Weak</th><th>Vulnerable</th>
  </tr></thead>
  <tbody id="rows"><tr><td colspan="6" class="empty">Waiting for a run…</td></tr></tbody>
</table>

<section id="chartsSection" hidden>
  <div class="charts-head">
    <div class="legend" id="legend"></div>
  </div>
  <div class="charts" id="charts"></div>
</section>
</main>

<script>
const cols = ["damage","block","damagePrevented","weak","vulnerable"];
const titles = { damage:"Damage", block:"Block", damagePrevented:"Prevented", weak:"Weak", vulnerable:"Vulnerable" };
// One hue per character; copies of the same character step through the variants in net-ID order.
const characterColors = {
  IRONCLAD:    ["#d14343","#8f2c2c","#ea8a8a","#b07a7a"],
  SILENT:      ["#5fcf6e","#3c9448","#a3e6ac","#86ad8c"],
  REGENT:      ["#f2a23a","#b57322","#f8c98a","#c2a079"],
  NECROBINDER: ["#9a63e0","#6c42a3","#c3a3ee","#9f8ab8"],
  DEFECT:      ["#4aa3f0","#2f72ad","#93c8f7","#7f9db5"],
};
const fallbackColors = ["#9a8f88","#6f6660","#c4b9b1","#4f4843"];
const fmt = new Intl.NumberFormat();

async function tick() {
  try {
    const r = await fetch("/stats.json", {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    document.getElementById("status").textContent = "no stats file yet";
    document.getElementById("dot").className = "dot";
  }
}

// Series color follows the player (by character, then copy index in net-ID order), so re-ranking never repaints anyone.
function seriesOrder(s) {
  const ids = new Set();
  for (const p of s.players) ids.add(p.netId);
  for (const f of (s.floors || [])) for (const p of f.players) ids.add(p.netId);
  return [...ids].sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
}
function playerFor(s, netId) {
  return s.players.find(p => p.netId === netId) || (s.floors || []).flatMap(f => f.players).find(p => p.netId === netId) || {};
}
function nameFor(s, netId) { const p = playerFor(s, netId); return p.name || String(netId); }
let colorMap = new Map();
function assignColors(s, order) {
  colorMap = new Map();
  const copies = {};
  for (const id of order) {
    const ch = (playerFor(s, id).character || "").toUpperCase();
    const n = copies[ch] = (copies[ch] || 0) + 1;
    const ramp = characterColors[ch] || fallbackColors;
    colorMap.set(id, ramp[Math.min(n - 1, ramp.length - 1)]);
  }
}
function colorFor(order, netId) { return colorMap.get(netId) || "var(--muted)"; }

function render(s) {
  const age = (Date.now() - Date.parse(s.updatedAt)) / 1000;
  const live = age < 15;
  document.getElementById("dot").className = "dot" + (live ? " live" : "");
  document.getElementById("status").textContent =
    (s.inCombat ? "in combat" : "between combats") + " · updated " + (age < 60 ? Math.round(age) + "s ago" : Math.round(age/60) + "m ago");
  document.getElementById("run").textContent = "seed " + s.seed + " · " + s.combatsFinished + " combats";
  const order = seriesOrder(s);
  assignColors(s, order);
  renderTable(s, order);
  renderCharts(s, order);
}

function renderTable(s, order) {
  const max = {};
  for (const c of cols) max[c] = Math.max(0, ...s.players.map(p => p[c] || 0));
  const body = document.getElementById("rows");
  body.innerHTML = "";
  if (!s.players.length) { body.innerHTML = '<tr><td colspan="6" class="empty">No players yet</td></tr>'; return; }
  for (const p of s.players) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="name"><span class="swatch" style="background:${colorFor(order, p.netId)}"></span>${esc(p.name)}<small>${esc(p.character)}</small></td>` +
      cols.map(c => `<td class="${(p[c]||0) > 0 && p[c] === max[c] && s.players.length > 1 ? "top" : ""}">${fmt.format(p[c] || 0)}</td>`).join("");
    body.appendChild(tr);
  }
}

function renderCharts(s, order) {
  const floors = s.floors || [];
  const section = document.getElementById("chartsSection");
  if (floors.length < 2) { section.hidden = true; return; }
  section.hidden = false;

  const legend = document.getElementById("legend");
  legend.innerHTML = order.map(id => `<span><span class="swatch" style="background:${colorFor(order, id)}"></span>${esc(nameFor(s, id))}</span>`).join("");

  const points = floors.map(f => {
    const row = { floor: f.floor, encounter: f.encounter, act: f.act, values: {} };
    for (const id of order) {
      const cur = f.players.find(p => p.netId === id) || {};
      row.values[id] = {};
      for (const c of cols) row.values[id][c] = cur[c] || 0;
    }
    return row;
  });

  const container = document.getElementById("charts");
  container.innerHTML = "";
  for (const c of cols) container.appendChild(chart(c, points, order, s));
}

function chart(col, points, order, s) {
  const W = 340, H = 160, padL = 44, padR = 12, padT = 10, padB = 8;
  const xs = points.map(p => p.floor);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  let yMin = 0, yMax = 0;
  for (const p of points) for (const id of order) { const v = p.values[id][col]; yMax = Math.max(yMax, v); yMin = Math.min(yMin, v); }
  if (yMax === yMin) yMax = yMin + 1;
  const x = f => padL + (xMax === xMin ? 0 : (f - xMin) / (xMax - xMin)) * (W - padL - padR);
  const y = v => padT + (1 - (v - yMin) / (yMax - yMin)) * (H - padT - padB);

  const ticks = niceTicks(yMin, yMax, 4);
  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="${titles[col]} per floor">`;
  for (const t of ticks) svg += `<line class="gridline" x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${padL - 6}" y="${y(t) + 4}" text-anchor="end">${compact(t)}</text>`;
  for (const id of order) {
    const color = colorFor(order, id);
    const d = points.map((p, i) => `${i ? "L" : "M"}${x(p.floor).toFixed(1)},${y(p.values[id][col]).toFixed(1)}`).join("");
    svg += `<path class="series" d="${d}" stroke="${color}"/>`;
  }
  svg += `<line class="crosshair" id="x-${col}" x1="0" x2="0" y1="${padT}" y2="${H - padB}" visibility="hidden"/>`;
  svg += `<g id="m-${col}"></g>`;
  svg += `</svg>`;

  const el = document.createElement("div");
  el.className = "chart";
  el.innerHTML = `<h2>${titles[col]}</h2>${svg}<div class="tip" id="tip-${col}"></div>`;
  const svgEl = el.querySelector("svg");
  svgEl.addEventListener("mousemove", ev => {
    const rect = svgEl.getBoundingClientRect();
    const px = (ev.clientX - rect.left) / rect.width * W;
    let best = 0, bestD = Infinity;
    points.forEach((p, i) => { const d = Math.abs(x(p.floor) - px); if (d < bestD) { bestD = d; best = i; } });
    const p = points[best];
    el.querySelector(`#x-${col}`).setAttribute("x1", x(p.floor));
    el.querySelector(`#x-${col}`).setAttribute("x2", x(p.floor));
    el.querySelector(`#x-${col}`).setAttribute("visibility", "visible");
    el.querySelector(`#m-${col}`).innerHTML = order.map(id =>
      `<circle class="marker" cx="${x(p.floor)}" cy="${y(p.values[id][col])}" r="4" fill="${colorFor(order, id)}"/>`).join("");
    const tip = el.querySelector(`#tip-${col}`);
    tip.innerHTML = `<b>Floor ${p.floor} · Act ${p.act}${p.encounter ? " · " + esc(pretty(p.encounter)) : ""}</b>` +
      order.map(id => `<div><span>${esc(nameFor(s, id))}</span><span>${fmt.format(p.values[id][col])}</span></div>`).join("");
    tip.style.display = "block";
    const left = (ev.clientX - rect.left) + 14, top = (ev.clientY - rect.top) + 14;
    tip.style.left = Math.min(left, rect.width - tip.offsetWidth - 4) + "px";
    tip.style.top = top + "px";
  });
  svgEl.addEventListener("mouseleave", () => {
    el.querySelector(`#x-${col}`).setAttribute("visibility", "hidden");
    el.querySelector(`#m-${col}`).innerHTML = "";
    el.querySelector(`#tip-${col}`).style.display = "none";
  });
  return el;
}

function niceTicks(min, max, count) {
  const span = max - min, raw = span / count, pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(m => m * pow).find(s => span / s <= count) || pow * 10;
  const out = [];
  for (let t = Math.ceil(min / step) * step; t <= max + 1e-9; t += step) out.push(Math.round(t * 1000) / 1000);
  return out;
}
function compact(n) { return Math.abs(n) >= 1000 ? (n / 1000).toFixed(n % 1000 ? 1 : 0) + "k" : String(n); }
function pretty(id) { return id.toLowerCase().replace(/_/g, " ").replace(/\b\w/g, ch => ch.toUpperCase()); }
function esc(t){ return String(t).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch])); }

tick(); setInterval(tick, 1000);
</script>
</body>
</html>
